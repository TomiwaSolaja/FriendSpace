services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: friendspace
      POSTGRES_PASSWORD: friendspace
      POSTGRES_DB: friendspace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friendspace -d friendspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
